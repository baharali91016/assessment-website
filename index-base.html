<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: linear-gradient(to right, #D9F5FC, #FDE2E2, #DBF6C1);
        }
        .container {
            display: grid;
            grid-template-areas:
                'menu header 		header 			header'
                'menu main_up_left 	main_up_right 	right_up'
                'menu main_down 	main_down 		right_up'
                'menu main_down 	main_down 		right_up'
                'menu main_down 	main_down 		right_down'
                'footer footer 		footer 			footer';
            padding: 5px;
            gap: 15px;
        }

        .container div {
            background-color: #f1f1f1;
            color: #000;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }

        .item1 {
            grid-area: header;
        }

        .item2 {
            grid-area: menu;
        }

        .item3 {
            grid-area: main_up_left;
        }

        .item4 {
            grid-area: main_up_right;
        }

        .item5 {
            grid-area: main_down;
        }

        .item6 {
            grid-area: right_up;
        }

        .item7 {
            grid-area: right_down;
        }

        .item8 {
            grid-area: footer;
        }


    </style>
</head>

<body>
    <div class="container">
        <div class="item1">Header</div>
        <div class="item2">Menu</div>
        <div class="item3">Main Up Left</div>
        <div class="item4">Main Up Right</div>
        <div class="item5">Main Down</div>
        <div class="item6">Right Up</div>
        <div class="item7">Right Down</div>
        <div class="item8">Footer</div>
    </div>
</body>

</html>
<!--
    In CSS Grid grid-template-areas, a named area must form a single rectangle. 
    This means every named area must be contiguous (connected cells)
    Rectangular (no L-shapes, T-shapes, or irregular forms)

    STEP 1 — Society office draws the map and names all blocks (North Block, West Block, Central Park, South Block)
    STEP 2 — Ahmad, Ali, Sara, Khan register their names and claim which plot they want — but it is just a claim on paper so far
    STEP 3 — The society officially allots the plot and hands over possession — now Ahmad physically exists on North Block, Ali physically exists on West Block
-->
